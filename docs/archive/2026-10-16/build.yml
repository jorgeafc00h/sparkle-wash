name: "Build and Deploy"
on: [push, pull_request]

jobs:
  # ─── Build on push to main ───────────────────────────────────────────────────────
  build-push-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Dotnet restore
        run: cd backend; dotnet restore
      - name: Build .NET API
        run: |
          cd backend
          dotnet build --self-contained -c Release
      - name: Run tests
        run: |
          cd backend
          dotnet test --no-build --verbosity quiet || exit 0
      - name: Login to Oracle Container Registry
        uses: hashicorp/vault-action@v2.5.1 # or OCI-specific OIDC login
        with:
          url: "https://login.oraclecloud.com"
          token: ${{ secrets.OCI_API_KEY }}
          oidc-provider: oci-identity-oidc-issuer
      - name: Push OCI image
        run: |
          VERSION=1.0.0-arm64
          # build step... docker build --target oci-final . -t reg.oraclecloud.com/ocirepo/${{ vars.REGISTRY_USERNAME }}/${{ secrets.REGISTRY_USERNAME }}/carwash/sparklewash-api:${VERSION}
          # push step ...
          true
      
      - name: Deploy OCI container instance (ARM64 Oracle Free Tier AMI)
        run: |
          ./deploy/ocibuild.sh
          ./deploy/oci-push.sh

  # ─── Build for Azure ACA deployment (alternative branch) ──────────────────────────
  build-azure-aca:
    if: github.ref == 'refs/heads/main' && github.ref != 'refs/heads/maintenance'
    runs-on: ubuntu-latest
    needs: build-push-oci # OCI pipeline succeeds; ACA builds in parallel via same repo
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Build image for Azure ACA
        uses: azure/containerapps-deploy@v4
        with:
          containerImage: sparklewash-api:latest
          registryServer: ${{ secrets.AZURE_REGISTRY_SERVER }}
          registryUsername: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          environmentVariables: ASPNETCORE_ENVIRONMENT=Production

  # ─── Integration test: verify .NET API responds + React PWA renders ────────────────
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack with Docker Compose (locally)
        run: docker compose -f docker-compose.yml up --build --no-start
      - name: Healthcheck endpoints pass
        run: |
          curl -sf http://localhost:8080/healthz || exit 1
          curl -sf http://localhost:8080/metrics/daily-wash-counts || exit 1
# ─── Complete ──────────────────────────────────────────────────────────────────────
