name: Validate project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-api-specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sparklewash_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPARKLEWASH_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=sparklewash_test;Username=postgres;Password=postgres;SSL Mode=Disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --prefix frontend
      - run: npm install --global @fission-ai/openspec@1.7.0
      - run: make verify
  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --platform linux/amd64 -t sparklewash-api:local .
      - run: scripts/smoke-container.sh
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: make ios-build
  desktop:
    name: SparkleWash Desktop (Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci
      - run: npm run build
