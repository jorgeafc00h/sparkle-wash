name: Verify and archive Neon history to IBM COS

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Tenant ID to export
        required: true
        type: string
      completed_before_utc:
        description: Exclusive UTC cutoff (YYYY-MM-DD)
        required: true
        type: string
      completed_on_or_after_utc:
        description: Optional inclusive UTC start (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ibm-archive
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sparklewash_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TENANT_ID: ${{ inputs.tenant_id }}
      COMPLETED_BEFORE_UTC: ${{ inputs.completed_before_utc }}
      COMPLETED_ON_OR_AFTER_UTC: ${{ inputs.completed_on_or_after_utc }}
      IBM_REGION: ${{ vars.IBM_REGION }}
      IBM_RESOURCE_GROUP: ${{ vars.IBM_RESOURCE_GROUP }}
      IBM_COS_BUCKET: ${{ vars.IBM_COS_BUCKET }}
      IBM_COS_INSTANCE_ID: ${{ vars.IBM_COS_INSTANCE_ID }}
      NEON_ARCHIVE_TENANT_ID: ${{ vars.NEON_ARCHIVE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate protected archive settings
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          NEON_ARCHIVE_CONNECTION_STRING: ${{ secrets.NEON_ARCHIVE_CONNECTION_STRING }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IBM_CLOUD_API_KEY NEON_ARCHIVE_CONNECTION_STRING IBM_REGION IBM_RESOURCE_GROUP IBM_COS_BUCKET IBM_COS_INSTANCE_ID NEON_ARCHIVE_TENANT_ID TENANT_ID COMPLETED_BEFORE_UTC; do
            if [[ -z "${!name}" ]]; then echo "Missing ibm-archive Environment setting: $name" >&2; exit 1; fi
          done
          if [[ ! "$TENANT_ID" =~ ^[A-Za-z0-9]+$ ]]; then echo 'Invalid tenant ID.' >&2; exit 1; fi
          if [[ "$TENANT_ID" != "$NEON_ARCHIVE_TENANT_ID" ]]; then echo 'Requested tenant is not allowed by this archive environment.' >&2; exit 1; fi
          if [[ ! "$COMPLETED_BEFORE_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo 'Invalid UTC cutoff date.' >&2; exit 1; fi
          if [[ -n "$COMPLETED_ON_OR_AFTER_UTC" && ! "$COMPLETED_ON_OR_AFTER_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo 'Invalid UTC start date.' >&2; exit 1; fi

      - name: Install PostgreSQL client and prepare read-only Neon connection
        env:
          NEON_ARCHIVE_CONNECTION_STRING: ${{ secrets.NEON_ARCHIVE_CONNECTION_STRING }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          umask 077
          archive_dir="$RUNNER_TEMP/sparklewash-archive-$GITHUB_RUN_ID"
          mkdir -m 700 "$archive_dir"
          echo "SPARKLEWASH_ARCHIVE_DIR=$archive_dir" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, pathlib, sys, urllib.parse
          raw = os.environ["NEON_ARCHIVE_CONNECTION_STRING"]
          url = urllib.parse.urlsplit(raw)
          if url.scheme not in ("postgres", "postgresql") or not url.hostname or not url.username or not url.password:
              raise SystemExit("Archive connection must be a PostgreSQL URI with a read-only login.")
          host, port = url.hostname, str(url.port or 5432)
          database = urllib.parse.unquote(url.path.lstrip("/"))
          user, password = urllib.parse.unquote(url.username), urllib.parse.unquote(url.password)
          fields = [host, port, database, user, password]
          if not database or any(any(ord(ch) < 32 for ch in field) for field in fields):
              raise SystemExit("Invalid control character or missing database in archive connection.")
          escape = lambda value: value.replace("\\", "\\\\").replace(":", "\\:")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"sparklewash-pgpass-{os.environ['GITHUB_RUN_ID']}"
          path.write_text(":".join(escape(field) for field in fields) + "\n")
          path.chmod(0o600)
          print("::add-mask::" + password)
          settings = {
              "PGHOST": host, "PGPORT": port, "PGDATABASE": database,
              "PGUSER": user, "PGPASSFILE": str(path), "PGSSLMODE": "verify-full",
              "PGSSLROOTCERT": "system",
          }
          for key, value in settings.items(): print(f"{key}={value}")
          print(f"SPARKLEWASH_PGPASSFILE={path}")
          PY

      - name: Migrate disposable restore database
        env:
          SPARKLEWASH_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sparklewash_restore?sslmode=disable
        run: scripts/db-migrate.sh

      - name: Export selected completed jobs from Neon
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$COMPLETED_ON_OR_AFTER_UTC" ]]; then args+=(--on-or-after "$COMPLETED_ON_OR_AFTER_UTC"); fi
          python3 backend/db/export_closed_jobs.py \
            "$TENANT_ID" "$COMPLETED_BEFORE_UTC" "${args[@]}" "$SPARKLEWASH_ARCHIVE_DIR"

      - name: Verify isolated restore and rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: sparklewash_restore
          PGUSER: postgres
          PGPASSWORD: postgres
          PGSSLMODE: disable
        run: python3 backend/db/rehearse_archive_restore.py "$SPARKLEWASH_ARCHIVE_DIR" --evidence-file "$RUNNER_TEMP/archive-restore-evidence.json"

      - name: Install and authenticate IBM Cloud Object Storage CLI
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install cloud-object-storage -f
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" -r "$IBM_REGION" -g "$IBM_RESOURCE_GROUP"
          ibmcloud cos config crn --crn "$IBM_COS_INSTANCE_ID"

      - name: Publish and verify immutable digest-addressed batch
        run: python3 backend/db/publish_archive_ibm_cos.py "$SPARKLEWASH_ARCHIVE_DIR" --bucket "$IBM_COS_BUCKET" --region "$IBM_REGION"

      - name: Remove temporary archive and connection files
        if: always()
        shell: bash
        run: |
          rm -rf "${SPARKLEWASH_ARCHIVE_DIR:-}"
          rm -f "${SPARKLEWASH_PGPASSFILE:-}"
