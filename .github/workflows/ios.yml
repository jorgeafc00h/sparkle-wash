name: iOS & firmware

on:
  push:
    paths:
      - "ios/**"
      - "edge/esp32-cam/**"
      - "src/carwash-api/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "edge/esp32-cam/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  sparklekit:
    name: SparkleKit (swift test + live API)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start the API
        env:
          SPARKLEWASH_INGEST_KEY: ci-ingest-key
          SPARKLEWASH_REGISTRATION_OPEN: "true"
          SPARKLEWASH_TENANTS_DIR: ${{ runner.temp }}/tenants
          SPARKLEWASH_DATA_FILE: ${{ runner.temp }}/data/observations.json
          SPARKLEWASH_ARRIVALS_FILE: ${{ runner.temp }}/data/arrivals.json
          SPARKLEWASH_JOBS_FILE: ${{ runner.temp }}/data/jobs.json
          SPARKLEWASH_DEVICES_FILE: ${{ runner.temp }}/data/devices.json
          SPARKLEWASH_OPERATIONS_FILE: ${{ runner.temp }}/data/operations.json
          SPARKLEWASH_PHOTO_DIR: ${{ runner.temp }}/data/photos
          ASPNETCORE_URLS: http://127.0.0.1:5080
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          dotnet build src/carwash-api -c Release
          nohup dotnet run --project src/carwash-api -c Release --no-build > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5080/api/packages > /dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: swift test
        working-directory: ios/SparkleKit
        env:
          SPARKLEWASH_API_URL: http://127.0.0.1:5080
          SPARKLEWASH_INGEST_KEY: ci-ingest-key
        run: swift test
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  app:
    name: App (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 16", "iPad Pro 13-inch (M4)"]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          name='${{ matrix.device }}'
          devices=[d for runtime,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in ds]
          match=[d for d in devices if d['name']==name] or [d for d in devices if d['name'].startswith(name.split(' ')[0])]
          print(match[-1]['udid'])")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project SparkleWash.xcodeproj -scheme SparkleWash \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/results.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*SparkleWash|Test Case|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - if: failure()
        run: grep -E "error|failed|XCTAssert" -A3 "$RUNNER_TEMP/xcodebuild.log" | head -200 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.device }}
          path: ${{ runner.temp }}/results.xcresult
          if-no-files-found: ignore

  firmware:
    name: ESP32-CAM firmware (arduino-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "esp32cam" "NimBLE-Arduino@1.4.3"
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32cam --board-options PartitionScheme=huge_app \
            edge/esp32-cam/esp32_cam_server
