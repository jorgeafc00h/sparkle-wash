<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 430" role="img" aria-label="Módulo ESP32-CAM">
  <defs>
    <filter id="p" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#13213a" flood-opacity=".28"/>
    </filter>
    <radialGradient id="glass" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".45" stop-color="#1e3a8a"/><stop offset="1" stop-color="#05070c"/>
    </radialGradient>
  </defs>
  <!-- board -->
  <g filter="url(#p)">
    <rect x="15" y="15" width="270" height="400" rx="16" fill="#1f2430"/>
    <rect x="23" y="23" width="254" height="384" rx="11" fill="#262c3a"/>
  </g>
  <!-- pin headers -->
  <g fill="#e2b04a" filter="url(#p)">
    <rect x="30" y="150" width="18" height="18" rx="3"/><rect x="30" y="182" width="18" height="18" rx="3"/>
    <rect x="30" y="214" width="18" height="18" rx="3"/><rect x="30" y="246" width="18" height="18" rx="3"/>
    <rect x="30" y="278" width="18" height="18" rx="3"/><rect x="30" y="310" width="18" height="18" rx="3"/>
    <rect x="30" y="342" width="18" height="18" rx="3"/><rect x="30" y="374" width="18" height="18" rx="3"/>
    <rect x="252" y="150" width="18" height="18" rx="3"/><rect x="252" y="182" width="18" height="18" rx="3"/>
    <rect x="252" y="214" width="18" height="18" rx="3"/><rect x="252" y="246" width="18" height="18" rx="3"/>
    <rect x="252" y="278" width="18" height="18" rx="3"/><rect x="252" y="310" width="18" height="18" rx="3"/>
    <rect x="252" y="342" width="18" height="18" rx="3"/><rect x="252" y="374" width="18" height="18" rx="3"/>
  </g>
  <!-- ESP32-S module with antenna -->
  <g filter="url(#p)">
    <rect x="62" y="150" width="176" height="150" rx="8" fill="#cfd5de"/>
    <rect x="70" y="158" width="160" height="134" rx="5" fill="#e6eaf0"/>
    <path d="M78 282 h18 v-14 h14 v14 h14 v-14 h14 v14 h14 v-14 h14 v14 h22" fill="none" stroke="#e2b04a" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <text x="150" y="208" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="800" font-size="28" fill="#13213a">ESP32-S</text>
  <text x="150" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="15" fill="#4b5873">Wi-Fi · Bluetooth</text>
  <!-- flash LED -->
  <g filter="url(#p)"><rect x="210" y="112" width="26" height="22" rx="4" fill="#fde68a"/><rect x="215" y="117" width="16" height="12" rx="2" fill="#fff7d6"/></g>
  <!-- camera module + ribbon -->
  <g filter="url(#p)">
    <rect x="128" y="96" width="44" height="40" rx="3" fill="#e2b04a"/>
    <rect x="94" y="34" width="112" height="86" rx="10" fill="#0d1017"/>
    <circle cx="150" cy="77" r="36" fill="#2b3242"/>
    <circle cx="150" cy="77" r="26" fill="#0a0c12"/>
    <circle cx="150" cy="77" r="17" fill="url(#glass)"/>
    <ellipse cx="143" cy="70" rx="5" ry="3.5" fill="#fff" opacity=".85"/>
  </g>
  <!-- microSD -->
  <g filter="url(#p)"><rect x="82" y="318" width="136" height="66" rx="6" fill="#9aa4b2"/><rect x="92" y="328" width="116" height="46" rx="4" fill="#b8c0cc"/></g>
  <text x="150" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14" fill="#2b3242">microSD</text>
  <text x="150" y="403" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="2" fill="#f6efe4" opacity=".8">ESP32-CAM</text>
</svg>
